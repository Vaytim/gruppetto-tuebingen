[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Danke-Seite und Teilnehmerliste nicht in Suchmaschinen
[[headers]]
  for = "/events/danke*"
  [headers.values]
    X-Robots-Tag = "noindex"

# security.txt auch unter der alten Adresse /security.txt
[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301
