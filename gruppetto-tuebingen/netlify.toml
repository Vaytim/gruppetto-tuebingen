[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sicherheits-Header für alle Seiten (für Besucher unsichtbar)
[[headers]]
  for = "/*"
  [headers.values]
    # Nicht in fremde Seiten einbetten lassen (Schutz vor Klick-Tricks)
    X-Frame-Options = "DENY"
    # Content-Security-Policy: legt fest, woher Inhalte geladen werden dürfen.
    # - script-src 'self' = nur eigene Skripte; 'unsafe-inline' lässt die von Astro eingebetteten
    #   Skripte zu, verbietet aber weiterhin das Nachladen fremder Skripte und eval() – der Kern des Schutzes.
    # - img-src erlaubt zusätzlich die Kartenkacheln (ArcGIS) und data:-Bilder (Icons/OG).
    # - connect-src 'self' = AJAX nur zur eigenen API. form-action 'self' = Formulare nur an die eigene Seite.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    # Dateien nur als das ausliefern, was sie sind
    X-Content-Type-Options = "nosniff"
    # Externe Seiten erfahren nur die Domain, nicht die genaue Unterseite
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Immer verschlüsselt (https)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Kamera, Mikrofon, Standort usw. werden nicht gebraucht
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Danke-Seite und Teilnehmerliste nicht in Suchmaschinen
[[headers]]
  for = "/events/danke*"
  [headers.values]
    X-Robots-Tag = "noindex"

# security.txt auch unter der alten Adresse /security.txt
[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301
